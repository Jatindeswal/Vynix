[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vynix"
version = "1.0.0"
description = "Project Vynix: Few-Shot Human-Object Interaction (HOI) Detection with Geometric Hallucination Veto"
readme = "README.md"
authors = [
    { name = "Project Vynix Team", email = "contact@vynix.ai" }
]
license = { text = "MIT" }
keywords = [
    "human-object-interaction",
    "hoi-detection",
    "computer-vision",
    "clip",
    "yolov8",
    "few-shot-learning",
    "geometric-veto",
    "vision-language-models"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "transformers>=4.30.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=9.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "datasets>=2.14.0",
    "huggingface-hub>=0.16.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/Jatindeswal/Vynix"
Repository = "https://github.com/Jatindeswal/Vynix.git"
Documentation = "https://github.com/Jatindeswal/Vynix#readme"

[project.scripts]
vynix = "vynix_cli:main"

[tool.setuptools]
py-modules = [
    "vynix_cli",
    "vynix_fewshot_adapter",
    "train_vynix_full",
    "test_vynix_pretrained",
    "evaluate_vynix_full",
    "vynix_prototype",
]
